<polygon points="110,150 260,60 410,150" fill="#ffffff" stroke="#2e7d32" stroke-width="6"/>
<rect x="140" y="150" width="240" height="180" fill="#ffffff" stroke="#2e7d32" stroke-width="6"/>
<rect x="225" y="240" width="70" height="90" fill="#2e7d32"/>
<circle cx="282" cy="288" r="5" fill="#ffd900"/>
