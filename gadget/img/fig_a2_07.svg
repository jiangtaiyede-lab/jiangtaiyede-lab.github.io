<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">公式オンラインでの買い方</text><rect x="50" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="163" y="200" font-size="25" font-weight="700" fill="#222428" text-anchor="middle">公式ストアを開く</text><text x="163" y="238" font-size="22" fill="#555" text-anchor="middle">キャリア公式</text><text x="294" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="316" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="429" y="200" font-size="23" font-weight="700" fill="#222428" text-anchor="middle">端末とプランを選ぶ</text><text x="429" y="238" font-size="22" fill="#555" text-anchor="middle">価格は公式表示</text><text x="560" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="582" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="695" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">手数料0円で契約</text><text x="695" y="238" font-size="22" fill="#555" text-anchor="middle">頭金なし</text></svg>