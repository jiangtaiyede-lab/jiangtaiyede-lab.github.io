<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="丸形PSEとひし形PSEの違い（マークの形のイメージ）">
<rect width="1200" height="560" fill="#f3f8fd"/>
<text x="60" y="78" font-family="sans-serif" font-size="38" font-weight="bold" fill="#19448e">PSEマークには2つの形があります</text>
<!-- round PSE -->
<rect x="60" y="120" width="510" height="330" rx="18" fill="#ffffff" stroke="#19448e" stroke-width="3"/>
<circle cx="315" cy="245" r="82" fill="none" stroke="#20262b" stroke-width="6"/>
<text x="315" y="262" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#20262b">PSE</text>
<text x="315" y="385" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#19448e">丸形PSE（今のモバイルバッテリー）</text>
<text x="315" y="425" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20262b">事業者自身の確認（自主確認）の表示</text>
<!-- diamond PSE -->
<rect x="630" y="120" width="510" height="330" rx="18" fill="#ffffff" stroke="#19448e" stroke-width="3"/>
<rect x="803" y="180" width="130" height="130" fill="none" stroke="#20262b" stroke-width="6" transform="rotate(45 868 245)"/>
<text x="868" y="262" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#20262b">PSE</text>
<text x="885" y="385" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#19448e">ひし形PSE</text>
<text x="885" y="425" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20262b">登録された第三者機関の検査が必要</text>
<rect x="180" y="472" width="840" height="64" rx="12" fill="#fff7cc" stroke="#e8d98a" stroke-width="2"/>
<text x="600" y="514" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a5b00">モバイルバッテリーも、ひし形への移行方針案が出ています（2027年3月予定）</text>
<text x="600" y="552" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#5b6b7a">※マークの形のイメージ図です</text>
</svg>
