<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="シリアルナンバーの場所を拡大したイメージ">
<rect width="1200" height="630" fill="#f3f8fd"/>
<text x="60" y="78" font-family="sans-serif" font-size="38" font-weight="bold" fill="#19448e">SNは裏面の印字の中にあります</text>
<!-- battery back -->
<rect x="60" y="130" width="560" height="420" rx="30" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<text x="95" y="195" font-family="sans-serif" font-size="27" font-weight="bold" fill="#20262b">Anker Power Bank (10K, 22.5W)</text>
<text x="95" y="245" font-family="sans-serif" font-size="25" fill="#5b6b7a">Model: A1257</text>
<text x="95" y="290" font-family="sans-serif" font-size="25" fill="#5b6b7a">Input: 5V ⎓ 3A / 9V ⎓ 2A</text>
<rect x="88" y="330" width="470" height="66" rx="8" fill="#fff7cc" stroke="#e60033" stroke-width="4"/>
<text x="110" y="375" font-family="sans-serif" font-size="28" font-weight="bold" fill="#20262b">SN: AXXXXXXXXXXXXXXXX</text>
<text x="95" y="460" font-family="sans-serif" font-size="23" fill="#5b6b7a">小さな文字で印字されています。</text>
<text x="95" y="498" font-family="sans-serif" font-size="23" fill="#5b6b7a">明るい場所で確認してください</text>
<!-- magnifier -->
<line x1="560" y1="360" x2="760" y2="300" stroke="#19448e" stroke-width="8"/>
<circle cx="880" cy="290" r="150" fill="#ffffff" stroke="#19448e" stroke-width="8"/>
<text x="880" y="272" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#20262b">SN： Aから始まる</text>
<text x="880" y="322" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e60033">16桁の番号</text>
<line x1="985" y1="400" x2="1060" y2="490" stroke="#19448e" stroke-width="16" stroke-linecap="round"/>
<rect x="700" y="486" width="440" height="96" rx="14" fill="#eef3fa"/>
<text x="920" y="528" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#19448e">「1」と「L」、「0」と「O」の</text>
<text x="920" y="562" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#19448e">打ち間違いに注意</text>
</svg>
