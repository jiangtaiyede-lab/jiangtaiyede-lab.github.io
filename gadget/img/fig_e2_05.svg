<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">月々サポートの仕組み</text><rect x="50" y="140" width="160" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="130" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">端末を購入</text><text x="130" y="238" font-size="22" fill="#555" text-anchor="middle">95,040円</text><text x="228" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="250" y="140" width="160" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="330" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">翌月から割引</text><text x="330" y="238" font-size="22" fill="#555" text-anchor="middle">−1,815円/月</text><text x="428" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="450" y="140" width="160" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="530" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">48か月で総額</text><text x="530" y="238" font-size="22" fill="#555" text-anchor="middle">−87,120円</text><text x="628" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="650" y="140" width="160" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="730" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">実質負担</text><text x="730" y="238" font-size="22" fill="#555" text-anchor="middle">7,920円</text></svg>