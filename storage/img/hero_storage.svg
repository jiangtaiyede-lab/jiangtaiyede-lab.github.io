<text x="640" y="86" font-size="30" font-weight="bold" fill="#20262b" text-anchor="middle">測ってから買う。それだけで失敗はほぼ防げる</text>
<text x="600" y="540" font-size="34" font-weight="bold" fill="#1a365d" text-anchor="middle">一人暮らしの収納家具は「サイズ」と「組み立て」で決まる</text>
<text x="600" y="586" font-size="24" fill="#5b6b7a" text-anchor="middle">置き場所・搬入経路・開閉スペースの3か所を測れば、買い間違いは大きく減ります</text>
</svg>
