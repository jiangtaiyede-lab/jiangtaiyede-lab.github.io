<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="900" height="470" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">買い方の違い</text><rect x="45" y="105" width="380" height="270" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="235" y="160" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">公式ストアで買う</text><text x="235" y="252" font-size="39" font-weight="700" fill="#222428" text-anchor="middle">価格がその場で確定</text><text x="235" y="320" font-size="21" fill="#555" text-anchor="middle">セール価格と保証条件が読みやすい</text><rect x="475" y="105" width="380" height="270" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="665" y="160" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">専門店で試聴する</text><text x="665" y="252" font-size="39" font-weight="700" fill="#ce0000" text-anchor="middle">装着感を確認できる</text><text x="665" y="320" font-size="19" fill="#555" text-anchor="middle">耳に合うかどうかを買う前に判定できる</text><text x="450" y="262" font-size="34" font-weight="700" fill="#222428" text-anchor="middle">VS</text></svg>