<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="買い替え候補3台の比べ方のイメージ">
<rect width="1200" height="630" fill="#f3f8fd"/>
<g font-family="sans-serif">
<rect x="90" y="130" width="300" height="330" rx="28" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<rect x="120" y="160" width="240" height="60" rx="10" fill="#19448e"/>
<text x="240" y="200" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">薄さで選ぶ</text>
<text x="240" y="290" text-anchor="middle" font-size="24" fill="#333333">厚さ約16mm</text>
<text x="240" y="326" text-anchor="middle" font-size="24" fill="#333333">10,000mAh</text>
<text x="240" y="400" text-anchor="middle" font-size="22" fill="#5b6b7a">毎日の持ち歩きに</text>
<rect x="450" y="130" width="300" height="330" rx="28" fill="#ffffff" stroke="#4c8462" stroke-width="4"/>
<rect x="480" y="160" width="240" height="60" rx="10" fill="#4c8462"/>
<text x="600" y="200" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">容量で選ぶ</text>
<text x="600" y="290" text-anchor="middle" font-size="24" fill="#333333">20,000mAh</text>
<text x="600" y="326" text-anchor="middle" font-size="24" fill="#333333">3ポート</text>
<text x="600" y="400" text-anchor="middle" font-size="22" fill="#5b6b7a">旅行・複数台の充電に</text>
<rect x="810" y="130" width="300" height="330" rx="28" fill="#ffffff" stroke="#e60033" stroke-width="4"/>
<rect x="840" y="160" width="240" height="60" rx="10" fill="#e60033"/>
<text x="960" y="200" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">保護機能で選ぶ</text>
<text x="960" y="290" text-anchor="middle" font-size="24" fill="#333333">保護機能6つ</text>
<text x="960" y="326" text-anchor="middle" font-size="24" fill="#333333">温度検知つき</text>
<text x="960" y="400" text-anchor="middle" font-size="22" fill="#5b6b7a">回収窓口まで見たい人に</text>
</g>
<rect x="240" y="510" width="720" height="62" rx="31" fill="#19448e"/>
<text x="600" y="551" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">比べる軸は「届出事業者名」と「メーカーの説明」</text>
</svg>
