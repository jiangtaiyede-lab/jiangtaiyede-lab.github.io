<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Anker PowerCore 10000自主回収のイメージ">
<rect width="800" height="450" fill="#f4f6f8"/>
<rect x="60" y="70" width="300" height="300" rx="18" fill="#ffffff" stroke="#23272e" stroke-width="5"/>
<text x="210" y="140" font-size="34" font-weight="900" text-anchor="middle" fill="#23272e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">回収対象</text>
<text x="210" y="240" font-size="58" font-weight="900" text-anchor="middle" fill="#ce0000" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">410,124台</text>
<text x="210" y="292" font-size="25" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">PowerCore 10000（A1263）</text>
<text x="210" y="338" font-size="22" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">国内販売分</text>
<rect x="440" y="70" width="300" height="300" rx="18" fill="#ffffff" stroke="#ce0000" stroke-width="5"/>
<text x="590" y="140" font-size="34" font-weight="900" text-anchor="middle" fill="#23272e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">回収率（2026年6月時点）</text>
<text x="590" y="240" font-size="64" font-weight="900" text-anchor="middle" fill="#ce0000" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">38.9%</text>
<text x="590" y="292" font-size="25" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">6割超がまだ未回収</text>
<text x="590" y="338" font-size="22" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">公式公表ベース</text>
<text x="400" y="415" font-size="30" font-weight="900" text-anchor="middle" fill="#23272e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">まず本体のシリアルを確認</text>
</svg>
