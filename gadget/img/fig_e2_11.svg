<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" fill="#ffffff"/><text x="450" y="105" font-size="30" font-weight="700" fill="#222428" text-anchor="middle">5G SAの下り最大（技術規格値）</text><text x="450" y="295" font-size="105" font-weight="700" fill="#222428" text-anchor="middle">4.8Gbps</text><text x="450" y="410" font-size="23" fill="#555" text-anchor="middle">ただし現行のhome 5GプランはNSA方式（2.5Gbps）で、SAは今後提供予定</text></svg>