<line x1="360" y1="96" x2="360" y2="110"/><line x1="400" y1="96" x2="400" y2="110"/><line x1="440" y1="96" x2="440" y2="110"/><line x1="480" y1="96" x2="480" y2="110"/><line x1="520" y1="96" x2="520" y2="110"/><line x1="560" y1="96" x2="560" y2="110"/><line x1="600" y1="96" x2="600" y2="110"/><line x1="640" y1="96" x2="640" y2="110"/><line x1="680" y1="96" x2="680" y2="110"/><line x1="720" y1="96" x2="720" y2="110"/><line x1="760" y1="96" x2="760" y2="110"/><line x1="800" y1="96" x2="800" y2="110"/><line x1="840" y1="96" x2="840" y2="110"/><line x1="880" y1="96" x2="880" y2="110"/><line x1="920" y1="96" x2="920" y2="110"/>
