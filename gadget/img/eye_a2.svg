<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="店頭とオンラインの手数料比較イメージ">
<rect width="800" height="450" fill="#f4f6f8"/>
<rect x="60" y="70" width="300" height="300" rx="18" fill="#ffffff" stroke="#23272e" stroke-width="5"/>
<text x="210" y="140" font-size="34" font-weight="900" text-anchor="middle" fill="#23272e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">店頭で契約</text>
<text x="210" y="228" font-size="27" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">契約事務手数料</text>
<text x="210" y="292" font-size="58" font-weight="900" text-anchor="middle" fill="#ce0000" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">4,950円</text>
<text x="210" y="338" font-size="20" text-anchor="middle" fill="#ce0000" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">＋「頭金」は店舗独自の上乗せ</text>
<rect x="440" y="70" width="300" height="300" rx="18" fill="#ffffff" stroke="#19448e" stroke-width="5"/>
<text x="590" y="140" font-size="34" font-weight="900" text-anchor="middle" fill="#19448e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">公式オンライン</text>
<text x="590" y="228" font-size="27" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">契約事務手数料</text>
<text x="590" y="292" font-size="58" font-weight="900" text-anchor="middle" fill="#19448e" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">0円</text>
<text x="590" y="338" font-size="22" text-anchor="middle" fill="#5b6b7a" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">頭金もなし</text>
</svg>
