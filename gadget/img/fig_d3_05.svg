<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">「実質負担」が安く見える構造</text><rect x="50" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="163" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">分割払いの月額を表示</text><text x="163" y="238" font-size="22" fill="#555" text-anchor="middle">小さく見える</text><text x="294" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="316" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="429" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">返却が前提の計算</text><text x="429" y="238" font-size="22" fill="#555" text-anchor="middle">総額が見えにくい</text><text x="560" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="582" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="695" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">2年後の残りは別</text><text x="695" y="238" font-size="22" fill="#555" text-anchor="middle">返却か買取か</text></svg>