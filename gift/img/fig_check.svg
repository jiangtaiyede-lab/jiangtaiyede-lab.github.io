<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
<rect width="1200" height="420" fill="#ffffff"/>
<text x="60" y="70" font-family="sans-serif" font-size="30" font-weight="900" fill="#20262b">注文前に確認する3点</text>
<g font-family="sans-serif">
<rect x="60" y="110" width="340" height="240" rx="12" fill="#fdf3f0" stroke="#e0c8c4"/>
<text x="90" y="165" font-size="24" font-weight="900" fill="#c62828">1. 送料は別枠</text>
<text x="90" y="215" font-size="20" fill="#20262b">商品代が予算内でも、</text>
<text x="90" y="250" font-size="20" fill="#20262b">送料で総額が超える</text>
<text x="90" y="285" font-size="20" fill="#20262b">ことがある</text>
<rect x="430" y="110" width="340" height="240" rx="12" fill="#fdf3f0" stroke="#e0c8c4"/>
<text x="460" y="165" font-size="24" font-weight="900" fill="#c62828">2. 対応機種・端子</text>
<text x="460" y="215" font-size="20" fill="#20262b">ケースは機種専用。</text>
<text x="460" y="250" font-size="20" fill="#20262b">ケーブル類は端子</text>
<text x="460" y="285" font-size="20" fill="#20262b">（USB-C／Lightning）</text>
<rect x="800" y="110" width="340" height="240" rx="12" fill="#fdf3f0" stroke="#e0c8c4"/>
<text x="830" y="165" font-size="24" font-weight="900" fill="#c62828">3. 納期</text>
<text x="830" y="215" font-size="20" fill="#20262b">クリスマスに間に合う</text>
<text x="830" y="250" font-size="20" fill="#20262b">か、到着予定日を確認。</text>
<text x="830" y="285" font-size="20" fill="#20262b">名入れ品は日数がかかる</text>
</g>
</svg>