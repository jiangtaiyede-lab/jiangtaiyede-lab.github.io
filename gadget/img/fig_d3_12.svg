<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="900" height="470" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">買い方の違い</text><rect x="45" y="105" width="390" height="270" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="240" y="160" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">一括購入</text><text x="240" y="252" font-size="58" font-weight="700" fill="#222428" text-anchor="middle">自分の物になる</text><text x="240" y="320" font-size="22" fill="#555" text-anchor="middle">総額が最初から読める</text><rect x="465" y="105" width="390" height="270" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="660" y="160" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">返却前提のプログラム</text><text x="660" y="252" font-size="58" font-weight="700" fill="#555c63" text-anchor="middle">2年後に返却</text><text x="660" y="320" font-size="22" fill="#555" text-anchor="middle">月額は小さく見える</text><text x="450" y="262" font-size="44" font-weight="700" fill="#222428" text-anchor="middle">VS</text></svg>