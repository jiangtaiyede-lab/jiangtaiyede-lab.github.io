<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><text x="45" y="58" font-size="31" font-weight="700" fill="#222428">解約時の扱い</text><rect x="50" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="163" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">最低利用期間</text><text x="163" y="238" font-size="22" fill="#555" text-anchor="middle">2年</text><text x="294" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="316" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="429" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">解約金</text><text x="429" y="238" font-size="22" fill="#555" text-anchor="middle">月額1か月分相当</text><text x="560" y="218" font-size="34" font-weight="700" fill="#ce0000">›</text><rect x="582" y="140" width="226" height="130" fill="#fafafa" stroke="#222428" stroke-width="2"/><text x="695" y="200" font-size="26" font-weight="700" fill="#222428" text-anchor="middle">前払い分</text><text x="695" y="238" font-size="20" fill="#555" text-anchor="middle">返金の扱いは公式確認</text></svg>