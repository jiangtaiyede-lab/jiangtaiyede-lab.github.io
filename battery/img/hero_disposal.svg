<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="リコール対象だった場合の手続きの流れ（申し込み・回収キット・返送・交換か返金）">
<rect width="1200" height="630" fill="#f3f8fd"/>
<text x="600" y="96" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#19448e">対象だった場合の手続きの流れ</text>
<g font-family="sans-serif">
<rect x="50" y="170" width="240" height="300" rx="20" fill="#ffffff" stroke="#19448e" stroke-width="3"/>
<circle cx="170" cy="240" r="34" fill="#19448e"/><text x="170" y="252" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">1</text>
<text x="170" y="330" text-anchor="middle" font-size="27" font-weight="bold" fill="#111111">申し込む</text>
<text x="170" y="372" text-anchor="middle" font-size="20" fill="#5b6b7a">公式フォーム</text>
<text x="170" y="402" text-anchor="middle" font-size="20" fill="#5b6b7a">または電話窓口</text>
<rect x="350" y="170" width="240" height="300" rx="20" fill="#ffffff" stroke="#19448e" stroke-width="3"/>
<circle cx="470" cy="240" r="34" fill="#19448e"/><text x="470" y="252" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">2</text>
<text x="470" y="330" text-anchor="middle" font-size="27" font-weight="bold" fill="#111111">回収キットが届く</text>
<text x="470" y="372" text-anchor="middle" font-size="20" fill="#5b6b7a">返送用レターパック</text>
<text x="470" y="402" text-anchor="middle" font-size="20" fill="#5b6b7a">防火シートなど</text>
<rect x="650" y="170" width="240" height="300" rx="20" fill="#ffffff" stroke="#19448e" stroke-width="3"/>
<circle cx="770" cy="240" r="34" fill="#19448e"/><text x="770" y="252" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">3</text>
<text x="770" y="330" text-anchor="middle" font-size="27" font-weight="bold" fill="#111111">本体を返送</text>
<text x="770" y="372" text-anchor="middle" font-size="20" fill="#5b6b7a">自治体のごみには</text>
<text x="770" y="402" text-anchor="middle" font-size="20" fill="#5b6b7a">出さない</text>
<rect x="950" y="170" width="240" height="300" rx="20" fill="#ffffff" stroke="#4c8462" stroke-width="3"/>
<circle cx="1070" cy="240" r="34" fill="#4c8462"/><text x="1070" y="252" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">4</text>
<text x="1070" y="330" text-anchor="middle" font-size="27" font-weight="bold" fill="#111111">交換か返金</text>
<text x="1070" y="372" text-anchor="middle" font-size="20" fill="#5b6b7a">新品への交換</text>
<text x="1070" y="402" text-anchor="middle" font-size="20" fill="#5b6b7a">または返金を選ぶ</text>
</g>
<g fill="#19448e"><path d="M298 306 l26 14 l-26 14 z"/><path d="M598 306 l26 14 l-26 14 z"/><path d="M898 306 l26 14 l-26 14 z"/></g>
<rect x="270" y="520" width="660" height="64" rx="32" fill="#fdf2f2" stroke="#e60033" stroke-width="2"/>
<text x="600" y="562" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e60033">申し込みまでは使用・充電を中止してください</text>
</svg>
