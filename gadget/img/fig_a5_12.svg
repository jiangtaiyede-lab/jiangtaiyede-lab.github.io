<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" fill="#ffffff"/><text x="450" y="105" font-size="30" font-weight="700" fill="#222428" text-anchor="middle">値上げは2年で</text><text x="450" y="295" font-size="105" font-weight="700" fill="#222428" text-anchor="middle">7,920円</text><text x="450" y="410" font-size="24" fill="#555" text-anchor="middle">1回線あたり年3,960円 × 2年。解約するまで止まらない</text></svg>