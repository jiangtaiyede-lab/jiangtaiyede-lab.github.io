<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="使用を中止すべき異常のサイン">
<rect width="1200" height="520" fill="#fdf2f2"/>
<text x="60" y="78" font-family="sans-serif" font-size="38" font-weight="bold" fill="#e60033">こんな変化は、使用中止のサイン</text>
<!-- swollen -->
<rect x="50" y="120" width="350" height="300" rx="18" fill="#ffffff" stroke="#e60033" stroke-width="3"/>
<path d="M 110 300 q 115 -70 230 0 l 0 50 l -230 0 z" fill="#eef3fa" stroke="#19448e" stroke-width="4"/>
<path d="M 110 300 q 115 -110 230 0" fill="none" stroke="#e60033" stroke-width="5"/>
<text x="225" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#20262b">膨らんで変形している</text>
<!-- hot -->
<rect x="425" y="120" width="350" height="300" rx="18" fill="#ffffff" stroke="#e60033" stroke-width="3"/>
<rect x="545" y="180" width="110" height="140" rx="20" fill="#eef3fa" stroke="#19448e" stroke-width="4"/>
<path d="M 505 200 q 14 -26 0 -52 M 600 200 q 14 -26 0 -52 M 695 200 q 14 -26 0 -52" fill="none" stroke="#e60033" stroke-width="6" transform="translate(0,60)"/>
<text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e60033">熱い</text>
<text x="600" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#20262b">以前より異常に熱くなる</text>
<!-- smell / fast drain -->
<rect x="800" y="120" width="350" height="300" rx="18" fill="#ffffff" stroke="#e60033" stroke-width="3"/>
<rect x="905" y="185" width="140" height="90" rx="12" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<rect x="1045" y="212" width="14" height="36" rx="6" fill="#19448e"/>
<rect x="918" y="198" width="34" height="64" fill="#e60033"/>
<text x="975" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#20262b">残量が急に減る</text>
<text x="975" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#20262b">焦げた臭いがする</text>
<text x="600" y="478" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#20262b">対象かどうかに関係なく、使用と充電を止めてメーカーや販売店へ相談を</text>
</svg>
