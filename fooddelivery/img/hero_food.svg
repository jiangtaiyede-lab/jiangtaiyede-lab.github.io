<rect x="300" y="180" width="55" height="45" fill="#bfe3c2" stroke="#2e7d32" stroke-width="4"/>
<!-- delivery box -->
<rect x="470" y="215" width="220" height="140" rx="8" fill="#f3c96b" stroke="#8a6d1f" stroke-width="5"/>
