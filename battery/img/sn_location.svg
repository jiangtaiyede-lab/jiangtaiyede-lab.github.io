<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="型番の印字がある場所（裏面・底面・側面）">
<rect width="1200" height="520" fill="#f3f8fd"/>
<text x="60" y="78" font-family="sans-serif" font-size="38" font-weight="bold" fill="#19448e">型番は「裏面・底面・側面」の小さな印字に</text>
<!-- back -->
<rect x="60" y="140" width="320" height="240" rx="24" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<text x="95" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#20262b">Power Bank</text>
<rect x="95" y="230" width="220" height="46" rx="6" fill="#fff7cc" stroke="#e60033" stroke-width="3"/>
<text x="112" y="262" font-family="sans-serif" font-size="23" font-weight="bold" fill="#20262b">Model: A○○○○</text>
<text x="95" y="320" font-family="sans-serif" font-size="21" fill="#5b6b7a">SN: A…16桁</text>
<text x="220" y="440" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#19448e">裏面</text>
<!-- bottom -->
<rect x="440" y="220" width="320" height="90" rx="18" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<rect x="475" y="243" width="220" height="44" rx="6" fill="#fff7cc" stroke="#e60033" stroke-width="3"/>
<text x="492" y="274" font-family="sans-serif" font-size="23" font-weight="bold" fill="#20262b">Model: A○○○○</text>
<text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#19448e">底面</text>
<text x="600" y="180" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b6b7a">本体を立てた図</text>
<!-- side -->
<rect x="820" y="140" width="90" height="240" rx="18" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<text x="865" y="270" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#e60033" transform="rotate(-90 865 260)">A○○○○</text>
<rect x="960" y="180" width="190" height="160" rx="14" fill="#eef3fa"/>
<text x="1055" y="245" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#19448e">側面の細い</text>
<text x="1055" y="282" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#19448e">印字の機種も</text>
<text x="865" y="440" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#19448e">側面</text>
<text x="600" y="495" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5b6b7a">※印字の位置は機種で異なります（イメージ図）</text>
</svg>
