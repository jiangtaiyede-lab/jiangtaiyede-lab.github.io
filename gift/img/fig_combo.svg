<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470">
<rect width="1200" height="470" fill="#ffffff"/>
<text x="60" y="66" font-family="sans-serif" font-size="30" font-weight="900" fill="#20262b">組み合わせは「メイン＋プチ」で合計を見る</text>
<rect x="80" y="130" width="380" height="170" rx="12" fill="#fdecea" stroke="#e0c8c4"/>
<text x="270" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="900" fill="#c62828">メインギフト</text>
<text x="270" y="250" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#20262b">3,000円台の1品</text>
<text x="540" y="235" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="900" fill="#20262b">＋</text>
<rect x="620" y="130" width="380" height="170" rx="12" fill="#fff7cc" stroke="#e8d98a"/>
<text x="810" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="900" fill="#7a5b00">プチギフト</text>
<text x="810" y="250" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#20262b">1,000円台の1品</text>
<path d="M270 330 L 270 380 L 810 380 L 810 330" stroke="#90a4ae" stroke-width="6" fill="none"/>
<text x="540" y="435" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="900" fill="#20262b">合計が5,000円以内か、足し算で検算する</text>
</svg>