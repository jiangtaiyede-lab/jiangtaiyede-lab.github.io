<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="測る場所は3か所（置き場所・搬入経路・開閉スペース）の図">
<rect width="1200" height="520" fill="#ffffff"/>
<!-- panel 1: footprint -->
<rect x="30" y="30" width="360" height="460" rx="16" fill="#eef3fa"/>
<text x="210" y="78" font-size="27" font-weight="bold" fill="#1a365d" text-anchor="middle">1. 置き場所</text>
<rect x="110" y="150" width="200" height="220" fill="#ffffff" stroke="#1a365d" stroke-width="5"/>
<line x1="110" y1="130" x2="310" y2="130" stroke="#ff0000" stroke-width="4"/>
<path d="M110 130 l12 -6 v12 Z M310 130 l-12 -6 v12 Z" fill="#ff0000"/>
<text x="210" y="118" font-size="23" fill="#ff0000" text-anchor="middle">幅</text>
<line x1="335" y1="150" x2="335" y2="370" stroke="#ff0000" stroke-width="4"/>
<text x="352" y="268" font-size="23" fill="#ff0000">高さ</text>
<text x="210" y="420" font-size="22" fill="#20262b" text-anchor="middle">幅・奥行・高さの3辺</text>
<text x="210" y="452" font-size="22" fill="#20262b" text-anchor="middle">巾木とコンセントも確認</text>
<!-- panel 2: door -->
<rect x="420" y="30" width="360" height="460" rx="16" fill="#eef3fa"/>
<text x="600" y="78" font-size="27" font-weight="bold" fill="#1a365d" text-anchor="middle">2. 搬入経路</text>
<rect x="520" y="120" width="160" height="280" fill="#ffffff" stroke="#1a365d" stroke-width="5"/>
<circle cx="660" cy="265" r="8" fill="#1a365d"/>
<line x1="520" y1="105" x2="680" y2="105" stroke="#ff0000" stroke-width="4"/>
<text x="600" y="92" font-size="23" fill="#ff0000" text-anchor="middle">ドアの有効幅</text>
<text x="600" y="440" font-size="22" fill="#20262b" text-anchor="middle">廊下・エレベーター・階段の</text>
<text x="600" y="472" font-size="22" fill="#20262b" text-anchor="middle">いちばん狭い場所が上限</text>
<!-- panel 3: drawer space -->
<rect x="810" y="30" width="360" height="460" rx="16" fill="#eef3fa"/>
<text x="990" y="78" font-size="27" font-weight="bold" fill="#1a365d" text-anchor="middle">3. 開閉スペース</text>
<rect x="860" y="150" width="150" height="220" fill="#ffffff" stroke="#1a365d" stroke-width="5"/>
<rect x="1010" y="180" width="110" height="60" fill="#ffd900" stroke="#20262b" stroke-width="3"/>
<line x1="1010" y1="270" x2="1120" y2="270" stroke="#ff0000" stroke-width="4"/>
<path d="M1010 270 l12 -6 v12 Z M1120 270 l-12 -6 v12 Z" fill="#ff0000"/>
<text x="1065" y="300" font-size="23" fill="#ff0000" text-anchor="middle">引き出しの奥行分</text>
<text x="990" y="420" font-size="22" fill="#20262b" text-anchor="middle">扉・引き出しが全開できるか</text>
<text x="990" y="452" font-size="22" fill="#20262b" text-anchor="middle">前に立つ自分の場所も必要</text>
</svg>
