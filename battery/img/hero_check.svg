<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="モバイルバッテリー裏面の型番とシリアルナンバーの確認イメージ">
<rect width="1200" height="630" fill="#f3f8fd"/>
<rect x="60" y="52" width="700" height="526" rx="36" fill="#ffffff" stroke="#19448e" stroke-width="4"/>
<rect x="96" y="88" width="628" height="120" rx="14" fill="#eef3fa"/>
<text x="124" y="140" font-family="sans-serif" font-size="34" font-weight="bold" fill="#19448e">Power Bank（10000mAh, 22.5W）</text>
<text x="124" y="184" font-family="sans-serif" font-size="24" fill="#5b6b7a">本体裏面の印字を確認してください（イメージ図）</text>
<text x="124" y="286" font-family="sans-serif" font-size="30" fill="#333333">型番：</text>
<rect x="238" y="248" width="238" height="58" fill="#ffd900"/>
<text x="252" y="290" font-family="sans-serif" font-size="42" font-weight="bold" fill="#111111">A1257</text>
<text x="124" y="382" font-family="sans-serif" font-size="30" fill="#333333">SN：</text>
<text x="238" y="382" font-family="sans-serif" font-size="34" font-weight="bold" fill="#111111">Aから始まる16桁</text>
<text x="124" y="452" font-family="sans-serif" font-size="24" fill="#5b6b7a">対象は A1257 / A1647 / A1652 / A1642 の4型番</text>
<circle cx="986" cy="452" r="52" fill="none" stroke="#19448e" stroke-width="5"/>
<text x="986" y="446" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#19448e">PSE</text>
<text x="986" y="480" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#19448e">マーク</text>
<circle cx="700" cy="270" r="118" fill="rgba(255,217,0,0.12)" stroke="#e60033" stroke-width="10"/>
<line x1="788" y1="356" x2="918" y2="486" stroke="#e60033" stroke-width="26" stroke-linecap="round"/>
<rect x="812" y="96" width="330" height="118" rx="16" fill="#19448e"/>
<text x="977" y="148" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">見る場所は「裏面」</text>
<text x="977" y="188" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#fff7cc">型番 → SN の順で確認</text>
</svg>
