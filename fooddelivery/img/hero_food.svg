<path d="M700 90 L700 62 M700 90 L722 102" stroke="#2e7d32" stroke-width="6" stroke-linecap="round"/>
<text x="400" y="425" font-size="26" font-weight="bold" fill="#2e7d32" text-anchor="middle">買い物に行かなくても、夕食が届く</text>
