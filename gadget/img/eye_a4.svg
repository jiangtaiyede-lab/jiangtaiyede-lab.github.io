<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="審査なしプランの価格イメージ">
<rect width="800" height="450" fill="#f4f6f8"/>
<g font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
<circle cx="238" cy="196" r="118" fill="#ffffff" stroke="#ce0000" stroke-width="9"/>
<text x="238" y="182" font-size="47" font-weight="900" text-anchor="middle" fill="#ce0000">審査</text>
<text x="238" y="240" font-size="47" font-weight="900" text-anchor="middle" fill="#ce0000">なし</text>
<text x="470" y="150" font-size="32" font-weight="900" fill="#23272e">だれでもモバイル</text>
<text x="470" y="222" font-size="27" fill="#5b6b7a">1GB＋10分かけ放題</text>
<text x="470" y="292" font-size="60" font-weight="900" fill="#23272e">月1,990円</text>
<text x="470" y="344" font-size="24" fill="#ce0000">ただし最低利用期間は2年</text>
<text x="400" y="415" font-size="26" font-weight="900" text-anchor="middle" fill="#23272e">「誰でも契約できる」ことの対価を数字で読む</text>
</g>
</svg>
